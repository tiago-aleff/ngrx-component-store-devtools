<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #333;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #CE93D8;
    }

    .header .logo {
      width: 24px;
      height: 24px;
      background: #7B1FA2;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .status-card {
      background: #16213e;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .status-row:last-child {
      margin-bottom: 0;
    }

    .status-label {
      font-size: 12px;
      color: #aaa;
    }

    .status-value {
      font-size: 12px;
      font-weight: 600;
    }

    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status-dot.active { background: #4CAF50; }
    .status-dot.scanning { background: #FF9800; animation: pulse 1.5s infinite; }
    .status-dot.inactive { background: #666; }
    .status-dot.error { background: #F44336; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .store-count {
      font-size: 24px;
      font-weight: 700;
      color: #CE93D8;
      text-align: center;
      padding: 8px 0;
    }

    .info {
      font-size: 11px;
      color: #888;
      text-align: center;
      margin-top: 8px;
    }

    .info a {
      color: #CE93D8;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <h1>NgRx ComponentStore DevTools</h1>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span class="status-label">Redux DevTools</span>
      <span class="status-indicator">
        <span class="status-dot" id="devtools-dot"></span>
        <span class="status-value" id="devtools-status">Checking...</span>
      </span>
    </div>
    <div class="status-row">
      <span class="status-label">Extension Status</span>
      <span class="status-indicator">
        <span class="status-dot" id="ext-dot"></span>
        <span class="status-value" id="ext-status">Checking...</span>
      </span>
    </div>
  </div>

  <div class="status-card">
    <div class="status-label" style="text-align: center; margin-bottom: 4px;">Connected Stores</div>
    <div class="store-count" id="store-count">-</div>
  </div>

  <p class="info">
    Stores appear in Redux DevTools with<br>
    <strong>[ComponentStore]</strong> prefix
  </p>

  <script src="popup.js"></script>
</body>
</html>
